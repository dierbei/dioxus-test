name: Release Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry

      - name: Cache cargo target
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-target

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix openssl@3)/lib" >> $GITHUB_ENV

      - name: Install Dioxus CLI
        run: |
          cargo install dioxus-cli --version 0.6.3
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install platform-specific dependencies
        shell: bash
        run: |
          case "$RUNNER_OS" in
            "macOS")
              brew install create-dmg
              ;;
            "Windows")
              choco install wixtoolset -y
              ;;
          esac

      - name: Bundle desktop apps
        shell: bash
        run: |
          case "$RUNNER_OS" in
            "macOS")
              dx bundle --platform desktop --release --package-types "macos" --package-types "dmg"
              ;;
            "Windows")
              dx bundle --platform desktop --release --package-types "nsis" --package-types "msi"
              ;;
          esac

      - name: Bundle iOS app
        if: runner.os == 'macOS'
        run: dx bundle --platform ios --release --package-types "ios"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-binaries
          path: |
            target/dx/**/bundle/macos/bundle/macos/*.app
            target/dx/**/bundle/macos/bundle/dmg/*.dmg
            target/dx/**/release/ios/*.app
            target/dx/**/bundle/windows/bundle/nsis/*.exe
            target/dx/**/bundle/windows/bundle/msi/*.msi

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Android with Docker
        uses: maxence-cornaton/dioxus-android-docker-builder@v0.3.0

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: target/dx/**/bundle/**/**/*.aab

  create-release:
    needs: [build, android]
    runs-on: macos-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.{dmg,app,exe,msi,aab}
